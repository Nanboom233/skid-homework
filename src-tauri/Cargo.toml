[package]
name = "skid-homework"
version = "0.1.0"
description = "Skid Homework - AI-powered learning assistant desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "skid-homework"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
# Keep the local crate lightweight in dev while avoiding problematic
# incremental objects on Windows/MSVC.
incremental = false
opt-level = 0
debug = 0

[profile.dev.package."*"]
# Build dependencies with release-like optimization in dev without forcing
# the app crate itself to emit oversized optimized artifacts.
opt-level = 3
debug = 0

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
flate2 = "1.1.9"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24", "directml", "cuda", "tensorrt"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
zip = { version = "=4.2.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.27.0"
