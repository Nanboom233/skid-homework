name: Tauri Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Select how to bump the semantic version
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tauri-release
  cancel-in-progress: false

jobs:
  manual-release:
    if: github.event_name == 'workflow_dispatch'
    name: Manual release
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      target_sha: ${{ github.sha }}
      release_type: ${{ inputs.release_type }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit

  collect-push-release-operations:
    if: github.event_name == 'push' && github.event.deleted == false
    name: Collect push release operations
    runs-on: ubuntu-latest

    outputs:
      has_operations: ${{ steps.collect.outputs.has_operations }}
      operation_count: ${{ steps.collect.outputs.operation_count }}
      operation_1: ${{ steps.collect.outputs.operation_1 }}
      operation_2: ${{ steps.collect.outputs.operation_2 }}
      operation_3: ${{ steps.collect.outputs.operation_3 }}
      operation_4: ${{ steps.collect.outputs.operation_4 }}
      operation_5: ${{ steps.collect.outputs.operation_5 }}
      operation_6: ${{ steps.collect.outputs.operation_6 }}
      operation_7: ${{ steps.collect.outputs.operation_7 }}
      operation_8: ${{ steps.collect.outputs.operation_8 }}
      operation_9: ${{ steps.collect.outputs.operation_9 }}
      operation_10: ${{ steps.collect.outputs.operation_10 }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect release operations
        id: collect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess


          def run_git(args):
              return subprocess.check_output(["git", *args], text=True).strip()


          before_sha = os.environ.get("BEFORE_SHA", "").strip()
          after_sha = os.environ.get("AFTER_SHA", "").strip()
          zero_sha = "0" * 40

          if not after_sha or after_sha == zero_sha:
              commits = []
          elif not before_sha or before_sha == zero_sha:
              commits = run_git(["rev-list", "--reverse", after_sha]).splitlines()
          else:
              commits = run_git(["rev-list", "--reverse", f"{before_sha}..{after_sha}"]).splitlines()

          marker_pattern = re.compile(
              r"\[(pre-release|release) (major|minor|patch)\]\s*$",
          )

          max_operations = 10
          operations = []
          for sha in commits:
              if not sha:
                  continue

              message = run_git(["log", "-1", "--pretty=%B", sha]).strip()
              match = marker_pattern.search(message)
              if not match:
                  continue

              action = match.group(1).lower()
              release_type = match.group(2).lower()
              short_sha = run_git(["rev-parse", "--short", sha])
              subject = run_git(["log", "-1", "--pretty=%s", sha])
              operations.append(
                  {
                      "operation_index": len(operations) + 1,
                      "target_sha": sha,
                      "short_sha": short_sha,
                      "release_action": action,
                      "release_type": release_type,
                      "prerelease": action == "pre-release",
                      "subject": subject,
                  }
              )

          if len(operations) > max_operations:
              raise SystemExit(
                  f"Found {len(operations)} release markers in one push, but this workflow "
                  f"supports at most {max_operations}. Split the push into smaller release batches."
              )

          has_operations = "true" if operations else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_operations={has_operations}\n")
              output.write(f"operation_count={len(operations)}\n")
              for index in range(1, max_operations + 1):
                  if index <= len(operations):
                      value = json.dumps(operations[index - 1], separators=(",", ":"))
                  else:
                      value = "{}"
                  output.write(f"operation_{index}={value}\n")

          if operations:
              print("Release operations:")
              for operation in operations:
                  print(
                      "{operation_index}. {short_sha} | {release_action} "
                      "{release_type} | {subject}".format(**operation)
                  )
          else:
              print("No release or pre-release commits were found in this push.")
          PY

  automatic-release-1:
    needs: collect-push-release-operations
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 1
    name: Auto release 1
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_1 }}
    secrets: inherit

  automatic-release-2:
    needs:
      - collect-push-release-operations
      - automatic-release-1
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 2
    name: Auto release 2
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_2 }}
    secrets: inherit

  automatic-release-3:
    needs:
      - collect-push-release-operations
      - automatic-release-2
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 3
    name: Auto release 3
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_3 }}
    secrets: inherit

  automatic-release-4:
    needs:
      - collect-push-release-operations
      - automatic-release-3
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 4
    name: Auto release 4
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_4 }}
    secrets: inherit

  automatic-release-5:
    needs:
      - collect-push-release-operations
      - automatic-release-4
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 5
    name: Auto release 5
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_5 }}
    secrets: inherit

  automatic-release-6:
    needs:
      - collect-push-release-operations
      - automatic-release-5
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 6
    name: Auto release 6
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_6 }}
    secrets: inherit

  automatic-release-7:
    needs:
      - collect-push-release-operations
      - automatic-release-6
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 7
    name: Auto release 7
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_7 }}
    secrets: inherit

  automatic-release-8:
    needs:
      - collect-push-release-operations
      - automatic-release-7
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 8
    name: Auto release 8
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_8 }}
    secrets: inherit

  automatic-release-9:
    needs:
      - collect-push-release-operations
      - automatic-release-8
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 9
    name: Auto release 9
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_9 }}
    secrets: inherit

  automatic-release-10:
    needs:
      - collect-push-release-operations
      - automatic-release-9
    if: github.event_name == 'push' && fromJSON(needs.collect-push-release-operations.outputs.operation_count) >= 10
    name: Auto release 10
    uses: ./.github/workflows/tauri-release-operation.yml
    permissions:
      contents: write
    with:
      operation_json: ${{ needs.collect-push-release-operations.outputs.operation_10 }}
    secrets: inherit

  no-push-release-operations:
    needs: collect-push-release-operations
    if: github.event_name == 'push' && needs.collect-push-release-operations.outputs.has_operations != 'true'
    name: No push release operations
    runs-on: ubuntu-latest

    steps:
      - name: Report no release marker
        shell: bash
        run: echo "No release or pre-release commits were found in this push."
